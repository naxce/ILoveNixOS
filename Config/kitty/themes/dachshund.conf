# Dachshund theme -- copper/rust on chocolate-brown.
# Not loaded yet. To use: add `include themes/dachshund.conf` near the top
# of kitty.conf (after the noir color block, or instead of it), then
# reload kitty (ctrl+shift+F5) or restart it.

