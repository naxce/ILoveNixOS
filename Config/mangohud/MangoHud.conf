position=top-left
offset_x=12
offset_y=12
background_alpha=0.45
background_color=241a12
round_corners=8
width=0
height=0

font_size=22
font_size_text=20
font_scale=1.0
alpha=1.0
text_color=f0dcc0

text_outline
text_outline_color=000000
text_outline_thickness=1.5

gpu_color=e8b98c
cpu_color=c48a5c
vram_color=8a6650
ram_color=f0dcc0
engine_color=e8e8e8
frametime_color=f0dcc0
media_player_color=e8b98c

fps_color_change
fps_value=30,60
fps_color=e05252,e8c85c,7fd97f

toggle_hud=Shift_R+F12
toggle_preset=Shift_L+F6
toggle_fps_limit=Shift_L+F1
toggle_logging=Shift_L+F2
upload_log=Shift_L+F3
reload_cfg=Shift_L+F4

output_folder=/home/$USER/Documents/MangoHud-logs
log_duration=30
autostart_log=0

hud_no_margin
no_small_font

[preset 0]

fps
frametime

gpu_stats
gpu_temp
gpu_load_change
gpu_load_value=50,90
gpu_load_color=7fd97f,e8c85c,e05252

cpu_stats
cpu_temp
cpu_load_change
cpu_load_value=50,90
cpu_load_color=7fd97f,e8c85c,e05252

ram
vram

[preset 1]

fps